[package]
name = "agent-stats-fleet"
version = "0.6.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "agent-stats fleet: find machines, add them over SSH or with a line to paste, list and remove them"
publish = false

[dependencies]
agent-stats-common = { path = "../common" }
agent-stats-hub = { path = "../hub" }
agent-stats-reporter = { path = "../reporter" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
ureq = "3"
toml = "0.9"
